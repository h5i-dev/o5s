name = "o5s"
main = "build/index.js"
compatibility_date = "2026-10-01"

[build]
command = "sh build.sh"

# Run next to the database: each request is several round trips.
[placement]
region = "aws:us-east-1"

# Placeholder: configure a Hyperdrive connection before deployment. For local use set
# CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE to a local database.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
