[package]
name = "o5s-worker"
description = "The calculator's shell on Cloudflare Workers: the kernel over PostgreSQL through Hyperdrive"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
o5s-kernel = { path = "../kernel" }
h5i-app-core = "0.1.1"
h5i-app-json = "0.1.1"
h5i-app-pgsql = "0.1.1"
h5i-app-sql = "0.1.1"
h5i-app-token = "0.1.1"
libcrux-hmac = "0.0.8"
worker = { version = "0.8", features = ["http", "axum", "tokio-postgres"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
