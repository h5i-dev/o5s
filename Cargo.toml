[workspace]
resolver = "3"
members = ["crates/core", "crates/pack", "crates/refs", "crates/repo", "crates/cli", "crates/prov", "crates/backend-s3", "crates/server", "crates/client", "bench/exp1", "bench/micro"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
pico2peta-core = { path = "crates/core" }
pico2peta-pack = { path = "crates/pack" }
pico2peta-refs = { path = "crates/refs" }
pico2peta-repo = { path = "crates/repo" }
pico2peta-prov = { path = "crates/prov" }
blake3 = "1"
fastcdc = "3"
zstd = "0.13"
thiserror = "2"
crc32fast = "1"
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
debug = 1
