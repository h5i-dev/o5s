[workspace]
resolver = "3"
members = ["crates/core", "crates/pack", "crates/refs", "crates/repo", "crates/cli", "crates/prov", "crates/weights", "crates/chunk", "crates/order", "crates/kernel", "crates/attest", "crates/backend-s3", "crates/server", "crates/client", "crates/net-kernel", "bench/exp1", "bench/exp1c", "bench/exp3", "bench/micro"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
pico2peta-core = { path = "crates/core" }
pico2peta-pack = { path = "crates/pack" }
pico2peta-refs = { path = "crates/refs" }
pico2peta-repo = { path = "crates/repo" }
pico2peta-prov = { path = "crates/prov" }
pico2peta-weights = { path = "crates/weights" }
pico2peta-chunk = { path = "crates/chunk" }
pico2peta-order = { path = "crates/order" }
pico2peta-kernel = { path = "crates/kernel" }
pico2peta-attest = { path = "crates/attest" }
blake3 = "1"
memmap2 = "0.9"
fastcdc = "3"
zstd = "0.13"
thiserror = "2"
crc32fast = "1"
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
debug = 1
