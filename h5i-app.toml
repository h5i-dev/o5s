# Read by `h5i app` (extract, check, prove, mutate, doctor).

[extract]
crate = "crates/kernel"
start-from = ["patch::merge", "graph::reachable", "graph::boundary", "graph::summary_rows", "graph::weak_component", "interval::conflict", "interval::splice", "interval::append_range", "interval::render_chunks", "interval::checked_render", "indexed::reachable", "indexed::boundary", "coordinates::line_boundaries", "order::frontier", "order::frontier_counts", "tags::visible", "lines::sorted", "lines::merge", "lines::ranges_valid", "lines::render", "document::empty", "document::validate", "document::commit", "document::materialize", "causality::frontier", "causality::sole_head"]
schema = false
include = ["h5i_app_std"]
std-specs = true

[check]
# Must exist and use only the standard axioms (every theorem in a hand-written
# module is gated as well).
theorems = [
  "o5s_kernel.Patch.merge_spec",
  "o5s_kernel.Patch.merge_authorized",
  "o5s_kernel.Patch.no_lost_patch",
  "o5s_kernel.Patch.dependency_closed",
  "o5s_kernel.Patch.successful_orders_converge",
  "o5s_kernel.Patch.delivery_converges",
  "o5s_kernel.Projection.live_reachability",
  "o5s_kernel.Projection.incremental_summary",
  "o5s_kernel.Projection.extracted_projection",
  "o5s_kernel.Constructor.boundary_spec",
  "o5s_kernel.Constructor.summary_rows_spec",
  "o5s_kernel.Interval.conflict_spec",
  "o5s_kernel.Interval.conflict_symmetric",
  "o5s_kernel.Interval.strict_gap_safe",
  "o5s_kernel.Interval.splice_spec",
  "o5s_kernel.Interval.append_range_spec",
  "o5s_kernel.Splice.extracted_disjoint_commutes",
  "o5s_kernel.Rendering.render_chunks_spec",
  "o5s_kernel.Checked.valid_chunks_safe",
  "o5s_kernel.Checked.checked_render_spec",
  "o5s_kernel.Components.weak_component_spec",
  "o5s_kernel.Components.extracted_batch_incremental",
  "o5s_kernel.Indexed.reachable_spec",
  "o5s_kernel.Indexed.clear_clean_spec",
  "o5s_kernel.Boundary.boundary_segment",
  "o5s_kernel.Coordinates.line_boundaries_ordered",
  "o5s_kernel.Order.frontier_exact",
  "o5s_kernel.Order.frontier_counts_exact",
  "o5s_kernel.Tags.visible_spec",
  "o5s_kernel.Tags.visible_iff_no_active_tag",
  "o5s_kernel.Tags.restore_other_cannot_revive",
  "o5s_kernel.LinesModel.merge_ok",
  "o5s_kernel.LinesModel.merge_fails",
  "o5s_kernel.LinesModel.merge_order_independent",
  "o5s_kernel.LinesModel.sep_trans",
]

[[mutant]]
name = "merge_approval_gate"
file = "crates/kernel/src/patch.rs"
old = "if !approved {"
new = "if approved {"

[[mutant]]
name = "merge_check_gate"
file = "crates/kernel/src/patch.rs"
old = "if !checks_passed {"
new = "if checks_passed {"

[[mutant]]
name = "merge_dependency_gate"
file = "crates/kernel/src/patch.rs"
old = "if !h5i_app_std::set::subset(dependencies, channel) {"
new = "if h5i_app_std::set::subset(dependencies, channel) {"

[[mutant]]
name = "line_conflict_boundary"
file = "crates/kernel/src/interval.rs"
old = "b_start <= a_start && a_start <= b_end"
new = "b_start < a_start && a_start < b_end"

[[mutant]]
name = "splice_suffix_boundary"
file = "crates/kernel/src/interval.rs"
old = "slice(bytes, end, bytes.len())"
new = "slice(bytes, start, bytes.len())"

[[mutant]]
name = "render_cursor_boundary"
file = "crates/kernel/src/interval.rs"
old = "cursor = chunk.1;"
new = "cursor = chunk.0;"

[[mutant]]
name = "validation_order_boundary"
file = "crates/kernel/src/interval.rs"
old = "state.cursor <= start"
new = "state.cursor >= start"

[[mutant]]
name = "validation_capacity_boundary"
file = "crates/kernel/src/interval.rs"
old = "replacement_len <= usize::MAX - state.capacity"
new = "replacement_len <= usize::MAX"

[[mutant]]
name = "component_reverse_edge"
file = "crates/kernel/src/graph.rs"
old = "out.push((edges[i].1, edges[i].0));"
new = "out.push((edges[i].0, edges[i].1));"

[[mutant]]
name = "indexed_mark"
file = "crates/kernel/src/indexed.rs"
old = "state.marks[vertex] = true;"
new = "state.marks[vertex] = false;"

[[mutant]]
name = "indexed_clear"
file = "crates/kernel/src/indexed.rs"
old = "state.marks[state.queue[i]] = false;"
new = "state.marks[state.queue[i]] = true;"

[[mutant]]
name = "indexed_live_filter"
file = "crates/kernel/src/indexed.rs"
old = "if live[vertex] {"
new = "if !live[vertex] {"

[[mutant]]
name = "line_lf_delimiter"
file = "crates/kernel/src/coordinates.rs"
old = "byte == b'\\n'"
new = "byte == b'\\r'"

[[mutant]]
name = "line_trailing_lf"
file = "crates/kernel/src/coordinates.rs"
old = "state.position < length"
new = "state.position <= length"
