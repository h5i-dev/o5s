# pico2peta-server sample configuration (systemd install).
# Check with: pico2peta-server check-config -c /etc/pico2peta/server.toml

[server]
listen = "127.0.0.1:8080"          # put TLS in front (nginx/envoy/ALB); see deploy/README.md
max_upload_bytes = 1099511627776   # 1 TiB per object
max_concurrent_requests = 256      # beyond this: 503 + Retry-After (load shedding)
request_timeout_secs = 3600        # until response headers (covers whole uploads)
shutdown_grace_secs = 30           # drain time after SIGTERM
trust_forwarded_for = false        # true behind a reverse proxy that sets X-Forwarded-For
# Native HTTPS instead of a TLS proxy (cert/key reloaded on SIGHUP):
#tls = { cert = "/etc/pico2peta/tls.crt", key = "/etc/pico2peta/tls.key" }
# Serve /metrics (and health) only on a private address for Prometheus:
#metrics_listen = "10.0.0.5:9100"
# Per-principal token bucket (anonymous callers keyed by client IP):
#rate_limit = { per_sec = 50.0, burst = 200.0 }

[repo]
path = "/var/lib/pico2peta/repo"
create = true                      # initialize on first start
refs = "local"                     # "backend": refs on S3, so several servers can share the repo

# Sealed packs on S3 (staging and refs stay on local disk under repo.path).
# Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN.
# Omit this section to keep packs on local disk.
#[backend]
#type = "s3"
#endpoint = "https://s3.us-east-1.amazonaws.com"
#region = "us-east-1"
#bucket = "my-pico2peta-bucket"
#prefix = "prod"
#path_style = false                # true for MinIO / most S3-compatible stores
#conditional_writes = true         # If-None-Match: *; disable only if the store rejects it.
#                                  # false is safe for packs only; refs = "backend" requires true
#max_in_flight = 32

[auth]
allow_anonymous = false
# OIDC: accept JWT bearer tokens from your identity provider as well.
#[auth.oidc]
#issuer = "https://accounts.example.com"
#audience = "pico2peta"
#principal_claim = "email"         # policies then name principals "oidc:<email>"
#principal_prefix = "oidc:"
# Tokens live in a separate file (mode 0600). Create entries with:
#   pico2peta-server gen-token <principal>
token_file = "tokens.toml"

# Grants: principal (name, "*" = any authenticated, "anonymous"),
# namespace prefix ("" = all), access = read | write | admin.
[[policy]]
principal = "admin"
namespace = ""
access = "admin"

[[policy]]
principal = "ci"
namespace = "pkgs"
access = "write"

[[policy]]
principal = "*"
namespace = "pkgs"
access = "read"

[audit]
path = "/var/log/pico2peta/audit.jsonl"
log_reads = false                  # true: also audit every object read
rotate_bytes = 1073741824          # rotate at 1 GiB; the hash chain continues

# Garbage collection: unreferenced objects are reclaimed in three phases,
# each at least grace_secs apart. Clients must point a ref at a new object
# within grace_secs of putting it (the put->replace lease).
[gc]
interval_secs = 1800               # 0 = no background GC (POST /v1/admin/gc still works)
grace_secs = 3600
min_garbage_ratio = 0.2
small_pack_bytes = 16777216
grouped = false                    # opt-in grouped repack of git content (EXP1 FAIL; see docs/EXP1.md)

[log]
format = "json"
filter = "info"                    # RUST_LOG overrides
