# The o5s API on Workers (`crates/worker`), configured at the repository root,
# which Workers Builds uses unless a root directory is set. Git projections
# and agent workspaces live in Cloudflare Artifacts (the ARTIFACTS binding).
# Same name as the Worker deployed from the dashboard (Workers Builds).
name = "o5s"
main = "crates/worker/build/index.js"
compatibility_date = "2026-10-01"

[build]
# Works whether the Workers Builds root directory is the repository root or
# crates/worker (Wrangler finds this file upward and runs the build there).
command = "[ -f build.sh ] || cd crates/worker; sh build.sh"

# Required by `wrangler preview` (non-production branch builds). Empty: previews
# use the top-level settings.
[previews]

# Run next to the database: each request is several round trips.
[placement]
region = "aws:us-east-1"

# PostgreSQL through Hyperdrive. Create the tables once with the database
# owner: `o5s-server ddl | psql "$OWNER_URL"`. For `wrangler dev`, set
# CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE to a local database.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "09738769027849ffb2cd540155d430c9"

# Git projections: /api/export and every merge push the channel's snapshot to
# the Artifacts repository `<tenant>-<repo>` (crates/worker/src/artifacts.rs).
[[artifacts]]
binding = "ARTIFACTS"
namespace = "default"

# Deliver Git projections whose export after an admission failed or never
# ran: the `scheduled` handler exports what `o5s_export_pending` still holds.
[triggers]
crons = ["*/5 * * * *"]
