# Read by `h5i app`: extract, check, prove, mutate, doctor.
# The extracted crate is pico2peta's net kernel (front decisions and wire parsers).

[extract]
crate = "../../crates/net-kernel"
start-from = [
  "parse::decode_hex",
  "parse::pkt_len",
  "parse::parse_dec_u64",
  "parse::parse_lfs_pointer",
  "parse::xet_chunk_header",
  "gitpush::decide_push",
  "publish::decide_create_once",
  "publish::decide_manifest",
  "publish::decide_commit",
  "publish::decide_rev",
  "guarded_transition",
  "read_only",
]
include = ["h5i_app_std"]
std-specs = true

[check]
theorems = [
  "pico2peta_net_kernel.Spec.decode_hex_spec",
  "pico2peta_net_kernel.Spec.pkt_len_spec",
  "pico2peta_net_kernel.Spec.parse_dec_u64_spec",
  "pico2peta_net_kernel.Spec.xet_chunk_header_spec",
  "pico2peta_net_kernel.Spec.GitPush.decide_push_spec",
  "pico2peta_net_kernel.Spec.GitPush.accepted_update",
  "pico2peta_net_kernel.Spec.GitPush.accepted_delete",
  "pico2peta_net_kernel.Spec.GitPush.atomic_all_or_nothing",
  "pico2peta_net_kernel.Spec.Policy.is_under_spec",
  "pico2peta_net_kernel.Spec.Policy.allows_spec",
  "pico2peta_net_kernel.Spec.Policy.reads_some_spec",
  "pico2peta_net_kernel.Spec.Policy.cells_of_spec",
  "pico2peta_net_kernel.Spec.Policy.visible_object_spec",
  "pico2peta_net_kernel.Spec.Policy.permits_spec",
  "pico2peta_net_kernel.Spec.Publish.decide_create_once_spec",
  "pico2peta_net_kernel.Spec.Publish.release_files_never_change",
  "pico2peta_net_kernel.Spec.Publish.decide_manifest_spec",
  "pico2peta_net_kernel.Spec.Publish.manifest_accepted",
  "pico2peta_net_kernel.Spec.Publish.decide_commit_spec",
  "pico2peta_net_kernel.Spec.Publish.commit_accepted",
  "pico2peta_net_kernel.Spec.Publish.decide_rev_spec",
  "pico2peta_net_kernel.guarded_transition.authorized",
  "pico2peta_net_kernel.guarded_transition.read_only_sound",
]

