name = "o5s"
main = "build/index.js"
compatibility_date = "2026-10-01"

[build]
command = "sh build.sh"

# `npx wrangler hyperdrive create o5s-calculator --connection-string=postgres://...`
# prints the id. For `wrangler dev`, set
# CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE to a local database.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
