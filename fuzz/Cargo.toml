[package]
name = "o5s-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Separate workspace: built only with `cargo +nightly fuzz` (see fuzz/README.md).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
o5s-core = { path = "../crates/core" }
o5s-pack = { path = "../crates/pack" }
o5s-refs = { path = "../crates/refs" }
o5s-server = { path = "../crates/server" }
o5s-backend-s3 = { path = "../crates/backend-s3" }
o5s-attest = { path = "../crates/attest" }
o5s-prov = { path = "../crates/prov" }
o5s-repo = { path = "../crates/repo" }
o5s-kernel = { path = "../crates/kernel" }
o5s-tree = { path = "../crates/tree" }
tempfile = "3"

[[bin]]
name = "pack_record"
path = "fuzz_targets/pack_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pack_index"
path = "fuzz_targets/pack_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
