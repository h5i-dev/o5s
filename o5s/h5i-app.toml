# Read by `h5i app` (extract, check, prove, mutate, doctor).

[extract]
start-from = ["transition", "apply", "sql_writes", "patch::merge", "graph::reachable", "graph::boundary", "graph::summary_rows", "interval::conflict", "interval::splice", "interval::append_range", "interval::render_chunks", "interval::checked_render"]
schema = true
include = ["h5i_app_sql", "h5i_app_std"]
std-specs = true

[check]
# Must exist and use only the standard axioms (every theorem in a hand-written
# module is gated as well).
theorems = [
  "o5s_kernel.Storage.pg_stored",
  "o5s_kernel.Patch.merge_spec",
  "o5s_kernel.Patch.merge_authorized",
  "o5s_kernel.Patch.no_lost_patch",
  "o5s_kernel.Patch.dependency_closed",
  "o5s_kernel.Patch.successful_orders_converge",
  "o5s_kernel.Patch.delivery_converges",
  "o5s_kernel.Projection.live_reachability",
  "o5s_kernel.Projection.incremental_summary",
  "o5s_kernel.Projection.extracted_projection",
  "o5s_kernel.Constructor.boundary_spec",
  "o5s_kernel.Constructor.summary_rows_spec",
  "o5s_kernel.Interval.conflict_spec",
  "o5s_kernel.Interval.conflict_symmetric",
  "o5s_kernel.Interval.strict_gap_safe",
  "o5s_kernel.Interval.splice_spec",
  "o5s_kernel.Interval.append_range_spec",
  "o5s_kernel.Splice.extracted_disjoint_commutes",
  "o5s_kernel.Rendering.render_chunks_spec",
  "o5s_kernel.Checked.valid_chunks_safe",
  "o5s_kernel.Checked.checked_render_spec",
]

[[mutant]]
name = "underflow_boundary"
old = "if a < b {"
new = "if a <= b {"

[[mutant]]
name = "merge_approval_gate"
file = "kernel/src/patch.rs"
old = "if !approved {"
new = "if approved {"

[[mutant]]
name = "merge_check_gate"
file = "kernel/src/patch.rs"
old = "if !checks_passed {"
new = "if checks_passed {"

[[mutant]]
name = "merge_dependency_gate"
file = "kernel/src/patch.rs"
old = "if !h5i_app_std::set::subset(dependencies, channel) {"
new = "if h5i_app_std::set::subset(dependencies, channel) {"

[[mutant]]
name = "line_conflict_boundary"
file = "kernel/src/interval.rs"
old = "b_start <= a_start && a_start <= b_end"
new = "b_start < a_start && a_start < b_end"

[[mutant]]
name = "splice_suffix_boundary"
file = "kernel/src/interval.rs"
old = "slice(bytes, end, bytes.len())"
new = "slice(bytes, start, bytes.len())"

[[mutant]]
name = "render_cursor_boundary"
file = "kernel/src/interval.rs"
old = "cursor = chunk.1;"
new = "cursor = chunk.0;"

[[mutant]]
name = "validation_order_boundary"
file = "kernel/src/interval.rs"
old = "state.cursor <= start"
new = "state.cursor >= start"

[[mutant]]
name = "validation_capacity_boundary"
file = "kernel/src/interval.rs"
old = "replacement_len <= usize::MAX - state.capacity"
new = "replacement_len <= usize::MAX"
