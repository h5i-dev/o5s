[package]
name = "o5s-platform"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
o5s-kernel = { path = "../kernel" }
o5s-registry = { path = "../registry", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
