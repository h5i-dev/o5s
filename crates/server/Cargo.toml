[package]
name = "pico2peta-server"
description = "pico2peta HTTP server: put/get/resolve/replace, authn/authz, audit log, metrics"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pico2peta-server"
path = "src/main.rs"

[dependencies]
pico2peta-core.workspace = true
pico2peta-repo.workspace = true
pico2peta-pack.workspace = true
pico2peta-prov.workspace = true
pico2peta-client = { path = "../client" }
pico2peta-backend-s3 = { path = "../backend-s3" }
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
blake3.workspace = true
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json", "query", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs", "io-util"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "catch-panic", "sensitive-headers", "timeout"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
prometheus-client = "0.24"
sha2 = "0.10"
fastrand = "2"
clap.workspace = true
getrandom = "0.3"
tempfile.workspace = true
base64 = "0.22"
jsonwebtoken = { version = "9", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
flate2 = "1"
sha1 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
jsonwebtoken = "9"
proptest.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking"] }
