[package]
name = "o5s-load"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Concurrent authenticated HTTP load driver for o5s"

[dependencies]
o5s-server = { path = "../server" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "fs"] }
serde_json = "1"
futures = "0.3"
