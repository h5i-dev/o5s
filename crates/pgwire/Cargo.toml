[package]
name = "o5s-pgwire"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "The o5s registry on PostgreSQL for native servers and Cloudflare Workers"

[dependencies]
o5s-platform = { path = "../platform" }
o5s-registry = { path = "../registry", features = ["serde"] }
h5i-app-sql = "0.1.1"
h5i-app-pgsql = "0.1.1"
tokio-postgres = { version = "0.7", default-features = false }
async-lock = "3"
futures = "0.3"
bytes = "1"
sha2 = "0.11"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time"], optional = true }

[features]
# TCP connections and tokio timers for the native server.
native = ["dep:tokio", "tokio-postgres/runtime"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
